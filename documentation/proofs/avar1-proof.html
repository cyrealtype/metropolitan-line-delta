<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>avar1 test Metropolitan Line Delta</title>
    <style>
      @font-face {
        font-family: "Metropolitan Line Delta";
        src: url("../../fonts/MetropolitanLineDelta-VF.ttf") format("truetype");
        font-weight: 400 900;
        font-display: swap;
      }

      :root { color-scheme: light; }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        background: #fff;
        color: #000;
        display: grid;
        grid-template-rows: 1fr auto;
        font-family: Arial, sans-serif;
      }

      main {
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      h2 {
        margin: 0;
        font-family: "Metropolitan Line Delta", sans-serif;
        font-size: clamp(4rem, 18vw, 18rem);
        line-height: 0.85;
        letter-spacing: -0.06em;
        font-weight: 400;
        font-variation-settings: "wght" 400;
        text-align: center;
      }

      .controls {
        width: min(34rem, calc(100% - 2rem));
        margin: 0 auto clamp(1.5rem, 4vw, 3rem);
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 1rem;
      }

      button {
        appearance: none;
        border: 1px solid #000;
        border-radius: 999px;
        padding: 0.45rem 0.85rem;
        background: #fff;
        color: #000;
        font: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        cursor: pointer;
      }

      button:hover, button:focus-visible { background: #000; color: #fff; }

      output {
        min-width: 2.2rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 0.75rem;
      }

      input[type="range"] {
        appearance: none;
        width: 100%;
        height: 1px;
        margin: 0;
        background: #000;
        accent-color: #000;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 11px;
        height: 11px;
        border: 1px solid #000;
        border-radius: 50%;
        background: #fff;
      }

      input[type="range"]::-moz-range-thumb {
        width: 9px;
        height: 9px;
        border: 1px solid #000;
        border-radius: 50%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h2 id="word" aria-label="Honon">Honon</h2>
    </main>

    <div class="controls" aria-label="Weight controls">
      <button id="toggle" type="button" aria-pressed="true">Pause</button>
      <input id="weight" type="range" min="400" max="900" value="400" step="1" aria-label="Font weight" />
      <output id="weightValue" for="weight">400</output>
    </div>

    <script>
      const word = document.querySelector('#word');
      const slider = document.querySelector('#weight');
      const value = document.querySelector('#weightValue');
      const toggle = document.querySelector('#toggle');
      const minimum = 400;
      const maximum = 900;
      const duration = 2800;
      let isPlaying = true;
      let startTime = performance.now();
      let frame;

      function setWeight(weight) {
        const rounded = Math.round(weight);
        word.style.fontWeight = rounded;
        word.style.fontVariationSettings = `"wght" ${rounded}`;
        slider.value = rounded;
        value.value = rounded;
        value.textContent = rounded;
      }

      function animate(now) {
        if (!isPlaying) return;
        const phase = ((now - startTime) % duration) / duration;
        const wave = (1 - Math.cos(phase * Math.PI * 2)) / 2;
        setWeight(minimum + wave * (maximum - minimum));
        frame = requestAnimationFrame(animate);
      }

      slider.addEventListener('input', () => {
        setWeight(slider.value);
        startTime = performance.now() - ((Number(slider.value) - minimum) / (maximum - minimum)) * duration / 2;
      });

      toggle.addEventListener('click', () => {
        isPlaying = !isPlaying;
        toggle.textContent = isPlaying ? 'Pause' : 'Play';
        toggle.setAttribute('aria-pressed', String(isPlaying));
        if (isPlaying) {
          startTime = performance.now();
          frame = requestAnimationFrame(animate);
        } else {
          cancelAnimationFrame(frame);
        }
      });

      frame = requestAnimationFrame(animate);
    </script>
  </body>
</html>
